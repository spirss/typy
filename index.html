<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1120" />
  <title>Typy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1120;
      color: #f1f5f9;
      line-height: 1.45;
      padding-bottom: 20px;
      min-height: 100vh;
      font-size: 16px;
    }
    header {
      background: #020617;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; flex: 1; }
    .back-btn {
      background: #1e293b;
      border: none;
      color: #94a3b8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .content { padding: 14px; }
    .match-card {
      background: #1e293b;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      cursor: pointer;
    }
    .match-card:active { opacity: 0.9; }
    .match-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
    .match-meta { font-size: 0.85rem; color: #94a3b8; }
    .league-tag {
      display: inline-block;
      background: #0f172a;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      margin-top: 8px;
      color: #94a3b8;
    }
    .section { margin-bottom: 20px; }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .market {
      background: #1e293b;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .market.best { border-color: #22c55e; background: #14532d18; }
    .market.good { border-color: #eab308; background: #42200618; }
    .market-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
    .market-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .prob { font-size: 0.95rem; color: #94a3b8; }
    .prob b { color: #f1f5f9; }
    .odds-big { font-size: 1.25rem; font-weight: 800; color: #38bdf8; }
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-left: 6px;
    }
    .badge.best { background: #166534; color: #bbf7d0; }
    .badge.good { background: #854d0e; color: #fef08a; }
    .badge.normal { background: #334155; color: #94a3b8; }
    .value { font-size: 0.85rem; color: #22c55e; margin-top: 4px; }
    .info-text { font-size: 0.9rem; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
    .empty { text-align: center; color: #64748b; padding: 40px 10px; }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" id="backBtn" style="display:none">← Wróć</button>
    <h1 id="headerTitle">Dzisiejsze mecze</h1>
  </header>

  <div class="content" id="content"></div>

  <script>
    const MATCHES = [
      {
        id: 1,
        league: "Premier League",
        match: "Arsenal - Liverpool",
        kickoff: "18:30",
        home: "Arsenal",
        away: "Liverpool",
        markets: [
          { name: "Zwycięzca meczu – Arsenal", pick: "1", prob: 0.41, odds: 2.40, edge: 0.0 },
          { name: "Zwycięzca meczu – Remis", pick: "X", prob: 0.26, odds: 3.40, edge: -0.03 },
          { name: "Zwycięzca meczu – Liverpool", pick: "2", prob: 0.33, odds: 2.90, edge: -0.01 },
          { name: "Powyżej 2.5 gola", pick: "Over 2.5", prob: 0.58, odds: 1.75, edge: 0.01 },
          { name: "Poniżej 2.5 gola", pick: "Under 2.5", prob: 0.42, odds: 2.10, edge: -0.06 },
          { name: "Oba zespoły strzelą – Tak", pick: "BTTS Tak", prob: 0.61, odds: 1.65, edge: 0.00 },
          { name: "Oba zespoły strzelą – Nie", pick: "BTTS Nie", prob: 0.39, odds: 2.20, edge: -0.06 },
          { name: "Arsenal wygra i BTTS", pick: "1 + BTTS", prob: 0.28, odds: 3.80, edge: 0.02 },
          { name: "Powyżej 3.5 gola", pick: "Over 3.5", prob: 0.34, odds: 2.90, edge: -0.01 }
        ]
      },
      {
        id: 2,
        league: "La Liga",
        match: "Real Madrid - Girona",
        kickoff: "21:00",
        home: "Real Madrid",
        away: "Girona",
        markets: [
          { name: "Zwycięzca meczu – Real Madrid", pick: "1", prob: 0.72, odds: 1.45, edge: 0.03 },
          { name: "Zwycięzca meczu – Remis", pick: "X", prob: 0.17, odds: 4.50, edge: -0.05 },
          { name: "Zwycięzca meczu – Girona", pick: "2", prob: 0.11, odds: 6.50, edge: -0.04 },
          { name: "Powyżej 2.5 gola", pick: "Over 2.5", prob: 0.63, odds: 1.60, edge: 0.01 },
          { name: "Poniżej 2.5 gola", pick: "Under 2.5", prob: 0.37, odds: 2.30, edge: -0.06 },
          { name: "Oba zespoły strzelą – Tak", pick: "BTTS Tak", prob: 0.52, odds: 1.85, edge: -0.02 },
          { name: "Real Madrid -1.5 (handicap)", pick: "Real -1.5", prob: 0.48, odds: 2.15, edge: 0.01 },
          { name: "Powyżej 3.5 gola", pick: "Over 3.5", prob: 0.38, odds: 2.50, edge: -0.02 }
        ]
      },
      {
        id: 3,
        league: "Serie A",
        match: "Inter - Napoli",
        kickoff: "20:45",
        home: "Inter",
        away: "Napoli",
        markets: [
          { name: "Zwycięzca meczu – Inter", pick: "1", prob: 0.48, odds: 2.10, edge: 0.00 },
          { name: "Zwycięzca meczu – Remis", pick: "X", prob: 0.27, odds: 3.30, edge: -0.03 },
          { name: "Zwycięzca meczu – Napoli", pick: "2", prob: 0.25, odds: 3.40, edge: -0.04 },
          { name: "Powyżej 2.5 gola", pick: "Over 2.5", prob: 0.51, odds: 1.90, edge: -0.02 },
          { name: "Poniżej 2.5 gola", pick: "Under 2.5", prob: 0.49, odds: 1.95, edge: -0.02 },
          { name: "Oba zespoły strzelą – Tak", pick: "BTTS Tak", prob: 0.55, odds: 1.70, edge: -0.04 },
          { name: "Inter wygra do zera", pick: "Inter 1-0 / 2-0", prob: 0.22, odds: 4.50, edge: 0.00 }
        ]
      },
      {
        id: 4,
        league: "Bundesliga",
        match: "Bayern - Dortmund",
        kickoff: "18:30",
        home: "Bayern",
        away: "Dortmund",
        markets: [
          { name: "Zwycięzca meczu – Bayern", pick: "1", prob: 0.61, odds: 1.70, edge: 0.02 },
          { name: "Zwycięzca meczu – Remis", pick: "X", prob: 0.21, odds: 4.20, edge: -0.03 },
          { name: "Zwycięzca meczu – Dortmund", pick: "2", prob: 0.18, odds: 4.00, edge: -0.07 },
          { name: "Powyżej 2.5 gola", pick: "Over 2.5", prob: 0.71, odds: 1.45, edge: 0.02 },
          { name: "Poniżej 2.5 gola", pick: "Under 2.5", prob: 0.29, odds: 2.70, edge: -0.08 },
          { name: "Oba zespoły strzelą – Tak", pick: "BTTS Tak", prob: 0.64, odds: 1.55, edge: -0.01 },
          { name: "Powyżej 3.5 gola", pick: "Over 3.5", prob: 0.48, odds: 2.20, edge: 0.03 },
          { name: "Bayern -1.5", pick: "Bayern -1.5", prob: 0.42, odds: 2.40, edge: 0.00 }
        ]
      }
    ];

    let currentView = "list";
    let selectedMatch = null;

    function getRecommendation(m) {
      // Sort by edge + high prob
      const sorted = [...m.markets].sort((a, b) => {
        const scoreA = a.edge * 2 + (a.prob > 0.6 ? 0.1 : 0);
        const scoreB = b.edge * 2 + (b.prob > 0.6 ? 0.1 : 0);
        return scoreB - scoreA;
      });
      return sorted[0];
    }

    function renderList() {
      document.getElementById("backBtn").style.display = "none";
      document.getElementById("headerTitle").textContent = "Dzisiejsze mecze";

      let html = `<div class="info-text">Kliknij mecz, żeby zobaczyć szczegółową analizę i najlepsze zakłady.</div>`;

      MATCHES.forEach(m => {
        const best = getRecommendation(m);
        html += `
          <div class="match-card" data-id="${m.id}">
            <div class="match-name">${m.match}</div>
            <div class="match-meta">${m.kickoff}</div>
            <div class="league-tag">${m.league}</div>
            <div style="margin-top:10px;font-size:0.9rem;color:#94a3b8">
              Najciekawsze: <b style="color:#38bdf8">${best.pick}</b> @ ${best.odds}
              ${best.edge > 0.015 ? '<span class="badge best">Warto</span>' : ''}
            </div>
          </div>
        `;
      });

      document.getElementById("content").innerHTML = html;

      document.querySelectorAll(".match-card").forEach(card => {
        card.addEventListener("click", () => {
          const id = +card.dataset.id;
          selectedMatch = MATCHES.find(m => m.id === id);
          currentView = "detail";
          render();
        });
      });
    }

    function renderDetail() {
      const m = selectedMatch;
      document.getElementById("backBtn").style.display = "block";
      document.getElementById("headerTitle").textContent = m.match;

      // Sort markets: best value first
      const markets = [...m.markets].sort((a, b) => b.edge - a.edge);

      let html = `
        <div class="info-text">
          ${m.league} • ${m.kickoff}<br>
          Poniżej rynki posortowane od najbardziej interesujących.
        </div>
      `;

      // Best bets section
      const bestOnes = markets.filter(x => x.edge >= 0.015 || x.prob >= 0.65);
      if (bestOnes.length) {
        html += `<div class="section"><div class="section-title">Najciekawsze zakłady</div>`;
        bestOnes.forEach(mk => {
          const cls = mk.edge >= 0.02 ? "best" : "good";
          const badge = mk.edge >= 0.02 ? "Warto" : (mk.prob >= 0.65 ? "Bezpieczne" : "OK");
          html += `
            <div class="market ${cls}">
              <div class="market-name">${mk.name}</div>
              <div class="market-row">
                <div class="prob">Szansa modelu: <b>${(mk.prob*100).toFixed(0)}%</b></div>
                <div class="odds-big">${mk.odds}</div>
              </div>
              <div style="margin-top:6px">
                <span class="badge ${cls === "best" ? "best" : "good"}">${badge}</span>
                ${mk.edge > 0 ? `<span class="value">+${(mk.edge*100).toFixed(1)}% edge</span>` : ""}
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      // All markets
      html += `<div class="section"><div class="section-title">Wszystkie rynki</div>`;
      markets.forEach(mk => {
        let cls = "";
        let badgeCls = "normal";
        let badgeText = "";
        if (mk.edge >= 0.02) { cls = "best"; badgeCls = "best"; badgeText = "Warto"; }
        else if (mk.prob >= 0.65) { cls = "good"; badgeCls = "good"; badgeText = "Bezpieczne"; }

        html += `
          <div class="market ${cls}">
            <div class="market-name">${mk.name}</div>
            <div class="market-row">
              <div class="prob">Model: <b>${(mk.prob*100).toFixed(0)}%</b></div>
              <div class="odds-big">${mk.odds}</div>
            </div>
            ${badgeText ? `<div style="margin-top:6px"><span class="badge ${badgeCls}">${badgeText}</span></div>` : ""}
          </div>
        `;
      });
      html += `</div>`;

      document.getElementById("content").innerHTML = html;
    }

    function render() {
      if (currentView === "list") renderList();
      else renderDetail();
    }

    document.getElementById("backBtn").addEventListener("click", () => {
      currentView = "list";
      selectedMatch = null;
      render();
    });

    render();
  </script>
</body>
</html>
